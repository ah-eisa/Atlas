<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta
      name="description"
      content="Portfolio analytics dashboard: allocation, performance, risk and Monte Carlo simulation for a multi-asset EUR portfolio."
    />
    <title>ATLAS Terminal — Portfolio Analytics &amp; Risk Lab</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='2' y1='2' x2='30' y2='30' gradientUnits='userSpaceOnUse'%3E%3Cstop offset='0%25' stop-color='%2300f0ff'/%3E%3Cstop offset='50%25' stop-color='%233b82f6'/%3E%3Cstop offset='100%25' stop-color='%238b5cf6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d='M16 2.5L28.5 9.5V22.5L16 29.5L3.5 22.5V9.5L16 2.5Z' stroke='url(%23g)' stroke-width='1.8' fill='%23080b11'/%3E%3Cpath d='M16 6.8L23.2 23.2H19.6L16 14.5L12.4 23.2H8.8L16 6.8Z' fill='url(%23g)'/%3E%3Cpath d='M11 18.5H21' stroke='%2300f0ff' stroke-width='2.2' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='11.2' r='1.5' fill='%23fff'/%3E%3C/svg%3E" />
    <script>
      // Apply the theme before the first paint. Without this the page would
      // render one palette and then repaint in the other, which is jarring
      // and, on a bright screen, genuinely uncomfortable.
      ;(function () {
        try {
          window.localStorage.removeItem('atlas.theme')
          var stored = window.localStorage.getItem('atlas.theme.v2')
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : 'dark'
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
        } catch (error) {
          /* A blocked localStorage must not stop the app from rendering. */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
