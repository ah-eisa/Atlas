name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      # The suite is hermetic: it never reaches Yahoo Finance, so CI stays
      # green regardless of upstream availability or rate limits.
      # Run from the repository root so the root pytest.ini applies and the
      # `backend.app` package is importable.
      - name: Run tests
        run: python -m pytest

      # The payload contract is committed. If the backend's payloads change,
      # the contract must change with them, and the front end's types must
      # still agree with it.
      - name: The payload contract is up to date
        run: |
          python backend/export_schema.py
          git diff --exit-code frontend/src/lib/payload-schema.json

  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npx oxlint src

      - name: Unit tests
        working-directory: frontend
        run: npm run test

      # `npm run build` runs `tsc -b` first, so this covers typechecking too.
      # It also proves the committed snapshot.json is valid, since the Vite
      # plugin reads it at build time.
      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Audit production dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: Browser smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # Both projects are Chromium profiles (desktop and a phone viewport),
      # so one browser install covers the suite.
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # The suite builds the app and serves the production bundle itself, so
      # this exercises the same artifact the container ships.
      - name: Run the smoke suite
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  docker:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t atlas:${{ github.sha }} .

      # The image must answer its own health check with the API up.
      - name: Health check
        run: |
          docker run -d --name atlas -p 8080:8000 atlas:${{ github.sha }}
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/v1/health; then
              echo "healthy"
              exit 0
            fi
            sleep 2
          done
          echo "service did not become healthy"
          docker logs atlas
          exit 1

      # Healthy is not enough: the image must also carry the bundled market
      # datasets, which a .dockerignore rule once left out.
      - name: Bundled data is in the image
        run: |
          curl -fsS http://127.0.0.1:8080/api/v1/fixed-income/yield-curve \
            | python3 -c "import json,sys; points = json.load(sys.stdin)['curve_points']; assert points, 'empty yield curve'; print(len(points), 'curve points')"
          curl -fsS http://127.0.0.1:8080/ | grep -q '<div id="root">' && echo "dashboard served"
